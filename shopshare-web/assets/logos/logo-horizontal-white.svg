<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 512" width="1150" height="512">
  <defs><linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#B7E4C7"/><stop offset="100%" stop-color="#95D5B2"/></linearGradient></defs>
  <g transform="translate(-140,0)">
    
    <g id="shopshare-mark">
      <!-- tote bag body -->
      <path d="M 176 208 L 336 208 L 322 372 Q 320 384 308 384 L 204 384 Q 192 384 190 372 Z"
            fill="#FFFFFF"/>
      <!-- seam / fold line -->
      <rect x="196" y="222" width="120" height="9" rx="4.5" fill="#2D6A4F" opacity="0.3"/>
      <!-- handle arch -->
      <path d="M 216 208 C 216 150 296 150 296 208" fill="none"
            stroke="#B7E4C7" stroke-width="16" stroke-linecap="round"/>
      <!-- sprouting leaf -->
      <g transform="rotate(-18 256 150)">
        <path d="M 256 150 Q 232 140 232 118 Q 232 96 256 96 Q 280 96 280 118 Q 280 140 256 150 Z"
              fill="url(#leafGrad)"/>
        <line x1="256" y1="149" x2="256" y2="101" stroke="#2D6A4F" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  <text x="300" y="290" font-family="Poppins" font-weight="700" font-size="150"
        text-anchor="start" dominant-baseline="middle" letter-spacing="-2" fill="#FFFFFF">shopshare</text>
</svg>